<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media - Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <div id="app"></div>

    <script>
        // Configuration
        const API_URL = 'http://localhost:8000/graphql/';
        let authToken = localStorage.getItem('authToken');

        // GraphQL Query Helper
        async function graphqlQuery(query, variables = {}) {
            try {
                const response = await axios.post(API_URL, {
                    query,
                    variables
                }, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...(authToken && { 'Authorization': `Bearer ${authToken}` })
                    }
                });
                return response.data;
            } catch (error) {
                console.error('GraphQL Error:', error);
                return { errors: [{ message: error.message }] };
            }
        }

        // App Component
        class App {
            constructor() {
                this.currentPage = 'login';
                this.user = null;
                this.posts = [];
                this.render();
            }

            async login(email, password) {
                const query = `
                    mutation LoginUser($email: String!, $password: String!) {
                        loginUser(email: $email, password: $password) {
                            user {
                                id
                                username
                                email
                            }
                            token
                            success
                            message
                        }
                    }
                `;

                const result = await graphqlQuery(query, { email, password });
                
                if (result.data?.loginUser?.success) {
                    authToken = result.data.loginUser.token;
                    localStorage.setItem('authToken', authToken);
                    this.user = result.data.loginUser.user;
                    this.currentPage = 'feed';
                    await this.loadFeed();
                    this.render();
                } else {
                    alert('Login failed: ' + (result.data?.loginUser?.message || 'Unknown error'));
                }
            }

            async loadFeed() {
                const query = `
                    query GetFeed {
                        feed(limit: 10) {
                            id
                            content
                            author {
                                id
                                username
                                profilePicture
                            }
                            likesCount
                            commentsCount
                            isLiked
                            createdAt
                        }
                    }
                `;

                const result = await graphqlQuery(query);
                if (result.data?.feed) {
                    this.posts = result.data.feed;
                }
            }

            async createPost(content) {
                const query = `
                    mutation CreatePost($content: String!) {
                        createPost(content: $content) {
                            post {
                                id
                                content
                                author {
                                    id
                                    username
                                }
                                createdAt
                            }
                            success
                        }
                    }
                `;

                const result = await graphqlQuery(query, { content });
                if (result.data?.createPost?.success) {
                    await this.loadFeed();
                    this.render();
                }
            }

            async likePost(postId) {
                const query = `
                    mutation LikePost($postId: ID!) {
                        likePost(postId: $postId) {
                            success
                        }
                    }
                `;

                const result = await graphqlQuery(query, { postId });
                if (result.data?.likePost?.success) {
                    await this.loadFeed();
                    this.render();
                }
            }

            logout() {
                authToken = null;
                localStorage.removeItem('authToken');
                this.user = null;
                this.currentPage = 'login';
                this.render();
            }

            render() {
                const app = document.getElementById('app');
                
                if (this.currentPage === 'login') {
                    app.innerHTML = this.renderLogin();
                } else if (this.currentPage === 'feed') {
                    app.innerHTML = this.renderFeed();
                }
            }

            renderLogin() {
                return `
                    <div class="min-h-screen bg-gradient-to-br from-blue-600 to-purple-600 flex items-center justify-center">
                        <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md">
                            <h1 class="text-3xl font-bold mb-6 text-center">Social Media</h1>
                            <form onsubmit="app.handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium mb-2">Email</label>
                                    <input type="email" id="email" class="w-full px-4 py-2 bg-gray-700 rounded border border-gray-600 focus:border-blue-500 outline-none" placeholder="user@example.com" required>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-2">Password</label>
                                    <input type="password" id="password" class="w-full px-4 py-2 bg-gray-700 rounded border border-gray-600 focus:border-blue-500 outline-none" placeholder="password" required>
                                </div>
                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-medium transition">
                                    Login
                                </button>
                            </form>
                            <p class="text-center text-gray-400 text-sm mt-4">
                                Demo credentials: user@example.com / password123
                            </p>
                        </div>
                    </div>
                `;
            }

            renderFeed() {
                return `
                    <div class="min-h-screen bg-gray-900">
                        <!-- Navigation -->
                        <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
                            <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                                <h1 class="text-2xl font-bold">Social Media</h1>
                                <div class="flex items-center gap-4">
                                    <span class="text-gray-400">Welcome, ${this.user?.username}</span>
                                    <button onclick="app.logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded transition">
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </nav>

                        <!-- Main Content -->
                        <div class="max-w-4xl mx-auto px-4 py-8">
                            <!-- Create Post -->
                            <div class="bg-gray-800 p-6 rounded-lg mb-6 border border-gray-700">
                                <h2 class="text-xl font-bold mb-4">Create Post</h2>
                                <form onsubmit="app.handleCreatePost(event)" class="space-y-4">
                                    <textarea id="postContent" class="w-full px-4 py-3 bg-gray-700 rounded border border-gray-600 focus:border-blue-500 outline-none" placeholder="What's on your mind?" rows="3" required></textarea>
                                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded font-medium transition">
                                        Post
                                    </button>
                                </form>
                            </div>

                            <!-- Feed -->
                            <div class="space-y-4">
                                ${this.posts.length === 0 ? '<p class="text-gray-400 text-center py-8">No posts yet</p>' : ''}
                                ${this.posts.map(post => `
                                    <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                                        <div class="flex items-center gap-3 mb-4">
                                            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold">
                                                ${post.author.username[0].toUpperCase()}
                                            </div>
                                            <div>
                                                <p class="font-semibold">${post.author.username}</p>
                                                <p class="text-sm text-gray-400">${new Date(post.createdAt).toLocaleDateString()}</p>
                                            </div>
                                        </div>
                                        <p class="mb-4">${post.content}</p>
                                        <div class="flex gap-6 text-gray-400">
                                            <button onclick="app.likePost('${post.id}')" class="flex items-center gap-2 hover:text-red-500 transition">
                                                <span>❤️</span>
                                                <span>${post.likesCount}</span>
                                            </button>
                                            <div class="flex items-center gap-2">
                                                <span>💬</span>
                                                <span>${post.commentsCount}</span>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            handleLogin(event) {
                event.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                this.login(email, password);
            }

            handleCreatePost(event) {
                event.preventDefault();
                const content = document.getElementById('postContent').value;
                if (content.trim()) {
                    this.createPost(content);
                    document.getElementById('postContent').value = '';
                }
            }
        }

        // Initialize app
        const app = new App();
    </script>
</body>
</html>
