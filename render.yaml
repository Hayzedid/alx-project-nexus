services:
  - type: web
    name: social-media-backend
    runtime: python
    plan: free
    buildCommand: >
      cd social-media-backend &&
      pip install -r ../requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: >
      cd social-media-backend &&
      gunicorn social_feed_api.wsgi:application --bind 0.0.0.0:$PORT --workers 4
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: social-media-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: social-media-redis
          type: redis
          property: connectionString

  - type: pserv
    name: social-media-db
    runtime: postgres
    plan: free
    ipAllowList: []
    postgresMajorVersion: "15"

  - type: redis
    name: social-media-redis
    plan: free
    ipAllowList: []
